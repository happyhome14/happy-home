<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập quản trị - Happy Home</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


<header>

    <div class="logo">
        <span>HAPPY</span> HOME
    </div>

</header>



<section class="admin-login-container">

    <div class="admin-login-box">

        <div class="admin-login-icon">
            🔐
        </div>

        <h1>
            ĐĂNG NHẬP QUẢN TRỊ
        </h1>

        <p>
            Hệ thống quản lý đặt phòng Happy Home
        </p>


        <form id="adminLoginForm">


            <div class="admin-login-field">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Nhập email quản trị"
                    autocomplete="username"
                    required
                >

            </div>



            <div class="admin-login-field">

                <label for="adminPassword">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >

            </div>



            <p
                id="adminLoginError"
                class="admin-login-error"
                style="display:none;"
            ></p>



            <button
                type="submit"
                class="admin-login-button"
            >
                ĐĂNG NHẬP
            </button>


        </form>


        <a
            href="../index.html"
            class="admin-login-back"
        >
            ← Quay về trang chủ
        </a>


    </div>

</section>



<footer>

    <p>
        © 2026 Happy Home - Homestay Hạ Long, Quảng Ninh
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/admin-login.js"></script>


</body>

</html>
